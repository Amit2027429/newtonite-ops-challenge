services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newtonite
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d newtonite"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/newtonite
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
